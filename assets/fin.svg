<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
<style>
.t{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="110" fill="#0b0b0e"/>
<g class="t"><text x="600" y="54" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif" font-size="26" font-weight="700" fill="#ece7de" text-anchor="middle">次回へつづく</text>
<text x="600" y="82" font-family="'Helvetica Neue','Segoe UI',Arial,sans-serif" font-size="11" letter-spacing="6" fill="#8a8a94" text-anchor="middle">À SUIVRE</text></g>
</svg>