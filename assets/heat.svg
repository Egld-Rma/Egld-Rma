<rect x="40" y="62" width="1120" height="4" rx="2" fill="#1d1d23"/>
<rect class="fill" x="40" y="62" width="1120" height="4" rx="2" fill="#d4213d"/>
<text x="40" y="122" font-family="'Helvetica Neue','Segoe UI',Arial,sans-serif" font-size="19" fill="#ece7de">Yakuza 3 Remastered</text>
