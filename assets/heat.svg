<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" width="1200" height="336">
<defs><clipPath id="c"><rect x="40" y="0" width="1120" height="336"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#d4213d" stop-opacity="0"/><stop offset=".5" stop-color="#d4213d"/><stop offset="1" stop-color="#d4213d" stop-opacity="0"/></linearGradient></defs>
<style>
.fill{transform-origin:40px 0;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) .2s both}
.run{animation:run 2.6s ease-in-out infinite}
