@keyframes on{0%{opacity:0}12%{opacity:.7}15%{opacity:.15}24%,100%{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fall{from{transform:translate(0,-50px)}to{transform:translate(-24px,400px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
